display_information:
  name: Seal Bot (late bloomers)
  description: Match window seals with Hyper3, Qdrant, and Cognee memory
  background_color: "#3AA0FF"
features:
  bot_user:
    display_name: seal-bot
    always_online: false
  slash_commands:
    - command: /cognee-ask
      url: https://macaw-claim-prowling.ngrok-free.dev/api/v1/slack/commands
      description: Ask Cognee's memory a question
      usage_hint: "[question]"
      should_escape: false
    - command: /cognee-remember
      url: https://macaw-claim-prowling.ngrok-free.dev/api/v1/slack/commands
      description: Store a fact in Cognee's memory
      usage_hint: "[fact]"
      should_escape: false
    - command: /seal-match
      url: https://macaw-claim-prowling.ngrok-free.dev/api/v1/slack/commands
      description: Match a seal photo to the curated product catalog
      usage_hint: "demo | Slack file ID or permalink"
      should_escape: false
    - command: /seal-confirm
      url: https://macaw-claim-prowling.ngrok-free.dev/api/v1/slack/commands
      description: Confirm a seal match and teach Cognee
      usage_hint: "[case-id] [SKU]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - files:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
